<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58" role="img" aria-labelledby="title desc">
  <title id="title">Animated engineering introduction</title>
  <desc id="desc">Cycling text describing robotics, autonomous systems, simulation, and hardware software integration.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="58" rx="14" fill="#0d1117"/>
  <rect x="90" y="53" width="820" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="600" text-anchor="middle" fill="#c9d1d9">
    <text x="500" y="35" opacity="0">Robotics + Software Engineering
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;.22;.25;.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="35" opacity="0">Autonomous Systems · Control · Simulation
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.25;.47;.50;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="35" opacity="0">Building across hardware and software
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.50;.72;.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="35" opacity="0">Build · Instrument · Test · Iterate
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.75;.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <circle cx="72" cy="29" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="928" cy="29" r="4" fill="#bc8cff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>