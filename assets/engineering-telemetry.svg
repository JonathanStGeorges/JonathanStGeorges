<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering telemetry</title>
  <desc id="desc">A reliable repository-hosted animated dashboard describing Jonathan's active engineering domains and development approach.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111b2a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="1098" height="298" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text x="32" y="36" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#58a6ff" letter-spacing="2">ENGINEERING TELEMETRY // REPOSITORY-HOSTED</text>
  <g transform="translate(165 164)"><circle r="92" fill="none" stroke="#21262d"/><circle r="66" fill="none" stroke="#21262d"/><circle r="38" fill="none" stroke="#21262d"/><path d="M0 0 L82 -34 A89 89 0 0 1 90 0 Z" fill="#58a6ff" opacity=".12"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></path><line x1="-92" y1="0" x2="92" y2="0" stroke="#21262d"/><line x1="0" y1="-92" x2="0" y2="92" stroke="#21262d"/><circle cx="48" cy="-40" r="5" fill="#3fb950" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="-61" cy="19" r="4" fill="#bc8cff" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><text x="0" y="6" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#c9d1d9">SYSTEMS</text></g>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"><text x="320" y="80" font-size="12" fill="#8b949e">ACTIVE DOMAINS</text><text x="320" y="109" font-size="18" font-weight="700" fill="#f0f6fc">ROBOTICS · AUTONOMY · SIMULATION</text><text x="320" y="137" font-size="18" font-weight="700" fill="#f0f6fc">EMBEDDED · AI SYSTEMS · WEB TOOLS</text><text x="320" y="183" font-size="12" fill="#8b949e">DEVELOPMENT LOOP</text><g font-size="13" fill="#c9d1d9"><text x="320" y="211">BUILD</text><text x="450" y="211">INSTRUMENT</text><text x="630" y="211">TEST</text><text x="745" y="211">ITERATE</text></g><g><rect x="320" y="225" width="105" height="8" rx="4" fill="#21262d"/><rect x="320" y="225" width="105" height="8" rx="4" fill="#58a6ff"><animate attributeName="width" values="20;105;20" dur="4s" repeatCount="indefinite"/></rect><rect x="450" y="225" width="150" height="8" rx="4" fill="#21262d"/><rect x="450" y="225" width="150" height="8" rx="4" fill="#3fb950"><animate attributeName="width" values="35;150;35" dur="4.6s" repeatCount="indefinite"/></rect><rect x="630" y="225" width="90" height="8" rx="4" fill="#21262d"/><rect x="630" y="225" width="90" height="8" rx="4" fill="#bc8cff"><animate attributeName="width" values="15;90;15" dur="3.6s" repeatCount="indefinite"/></rect><rect x="745" y="225" width="115" height="8" rx="4" fill="#21262d"/><rect x="745" y="225" width="115" height="8" rx="4" fill="#f0883e"><animate attributeName="width" values="25;115;25" dur="4.2s" repeatCount="indefinite"/></rect></g><text x="320" y="270" font-size="12" fill="#3fb950">● STATUS: BUILDING, TESTING AND ITERATING</text></g>
  <g transform="translate(965 165)"><circle r="55" fill="none" stroke="#30363d" stroke-width="8"/><circle r="55" fill="none" stroke="#58a6ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="250 96"><animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="8s" repeatCount="indefinite"/></circle><text x="0" y="-2" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">MODE</text><text x="0" y="20" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#f0f6fc">ACTIVE</text></g>
