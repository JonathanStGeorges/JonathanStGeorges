  <text x="28" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#ffa657">Simulation and engine research</text>
  <text x="28" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8b949e">Experimental physics, rendering architecture</text><text x="28" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8b949e">and deterministic game-system development.</text>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#c9d1d9"><rect x="28" y="137" width="64" height="25" rx="12.5" fill="#f0883e" fill-opacity=".13" stroke="#f0883e" stroke-opacity=".45"/><text x="60" y="154" text-anchor="middle">C++</text><rect x="101" y="137" width="74" height="25" rx="12.5" fill="#f0883e" fill-opacity=".13" stroke="#f0883e" stroke-opacity=".45"/><text x="138" y="154" text-anchor="middle">CMAKE</text><rect x="184" y="137" width="90" height="25" rx="12.5" fill="#f0883e" fill-opacity=".13" stroke="#f0883e" stroke-opacity=".45"/><text x="229" y="154" text-anchor="middle">PHYSICS</text></g>
  <g transform="translate(493 37)"><circle r="26" fill="none" stroke="#f0883e" stroke-opacity=".18" stroke-width="2"/><circle r="18" fill="none" stroke="#f0883e" stroke-opacity=".55" stroke-width="2" stroke-dasharray="18 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7.2s" repeatCount="indefinite"/></circle><circle r="5" fill="#f0883e" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle></g>
