<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">PhysicsEngine</title>
  <desc id="desc">Experimental physics, rendering architecture and deterministic game-system development.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101b2b"/></linearGradient><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#f0883e" stop-opacity="0"/><stop offset=".5" stop-color="#f0883e" stop-opacity=".65"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="558" height="188" rx="16" fill="url(#bg)" stroke="#30363d"/><rect x="2" y="2" width="5" height="186" rx="2.5" fill="#f0883e"/>
  <rect x="-180" y="0" width="180" height="190" fill="url(#scan)" opacity=".22"><animate attributeName="x" from="-180" to="560" dur="6.5s" repeatCount="indefinite"/></rect>
