<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">3D Drone PathPlanner</title>
  <desc id="desc">Autonomous vehicle tooling for designing, visualizing and saving three-dimensional flight paths.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101b2b"/></linearGradient><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".5" stop-color="#3fb950" stop-opacity=".65"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="558" height="188" rx="16" fill="url(#bg)" stroke="#30363d"/><rect x="2" y="2" width="5" height="186" rx="2.5" fill="#3fb950"/>
  <rect x="-180" y="0" width="180" height="190" fill="url(#scan)" opacity=".22"><animate attributeName="x" from="-180" to="560" dur="6.3s" repeatCount="indefinite"/></rect>
  <text x="28" y="34" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#3fb950" letter-spacing="1.5">AUTONOMY // TOOL</text>
  <text x="28" y="63" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">3D Drone PathPlanner</text>
  <text x="28" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7ee787">Autonomous vehicle tooling</text>
  <text x="28" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8b949e">Design, visualize and save three-dimensional</text><text x="28" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8b949e">flight paths with spline-based planning.</text>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#c9d1d9"><rect x="28" y="137" width="70" height="25" rx="12.5" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".45"/><text x="63" y="154" text-anchor="middle">JAVA</text><rect x="107" y="137" width="82" height="25" rx="12.5" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".45"/><text x="148" y="154" text-anchor="middle">JAVAFX</text><rect x="198" y="137" width="64" height="25" rx="12.5" fill="#3fb950" fill-opacity=".13" stroke="#3fb950" stroke-opacity=".45"/><text x="230" y="154" text-anchor="middle">3D</text></g>
  <g transform="translate(493 37)"><circle r="26" fill="none" stroke="#3fb950" stroke-opacity=".18" stroke-width="2"/><circle r="18" fill="none" stroke="#3fb950" stroke-opacity=".55" stroke-width="2" stroke-dasharray="18 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7.5s" repeatCount="indefinite"/></circle><circle r="5" fill="#3fb950" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle></g>
  <text x="532" y="177" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10" fill="#6e7681">OPEN REPOSITORY ↗</text>
</svg>