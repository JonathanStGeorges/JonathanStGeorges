<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan St-Georges animated engineering header</title>
  <desc id="desc">A dark technical interface with animated circuit paths, scanning light, and engineering labels.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16" />
      <stop offset="0.5" stop-color="#0d1b2a" />
      <stop offset="1" stop-color="#08111f" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.42" />
      <stop offset="0.45" stop-color="#3fb950" stop-opacity="0.12" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" />
      <stop offset="0.48" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#bc8cff" />
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#58a6ff" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#background)" />
  <rect width="1200" height="300" rx="20" fill="url(#grid)" />
  <ellipse cx="600" cy="150" rx="430" ry="190" fill="url(#coreGlow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <g fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M0 72 H158 L210 124 H355">
      <animate attributeName="stroke-dasharray" values="2 14;18 8;2 14" dur="5s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M0 224 H130 L190 164 H335">
      <animate attributeName="stroke-dasharray" values="20 10;4 16;20 10" dur="6s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M1200 76 H1040 L988 128 H844">
      <animate attributeName="stroke-dasharray" values="4 16;20 8;4 16" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" from="0" to="190" dur="4.5s" repeatCount="indefinite" />
    </path>
    <path d="M1200 222 H1070 L1010 162 H865">
      <animate attributeName="stroke-dasharray" values="18 8;3 15;18 8" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" from="0" to="170" dur="5.2s" repeatCount="indefinite" />
    </path>
  </g>

  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2" filter="url(#glow)">
    <circle cx="158" cy="72" r="6" />
    <circle cx="210" cy="124" r="6" />
    <circle cx="190" cy="164" r="6" />
    <circle cx="130" cy="224" r="6" />
    <circle cx="1040" cy="76" r="6" />
    <circle cx="988" cy="128" r="6" />
    <circle cx="1010" cy="162" r="6" />
    <circle cx="1070" cy="222" r="6" />
  </g>

  <g fill="none" stroke="#58a6ff" filter="url(#glow)">
    <circle cx="600" cy="150" r="96" stroke-opacity="0.24" stroke-dasharray="8 18">
      <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="150" r="116" stroke="#bc8cff" stroke-opacity="0.16" stroke-dasharray="2 22">
      <animateTransform attributeName="transform" type="rotate" from="360 600 150" to="0 600 150" dur="24s" repeatCount="indefinite" />
    </circle>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">
    <text x="600" y="116" fill="#8b949e" font-size="14" letter-spacing="5">JJ // EXIBIST</text>
    <text x="600" y="158" fill="#f0f6fc" font-size="42" font-weight="700" letter-spacing="1.5">JONATHAN ST-GEORGES</text>
    <text x="600" y="190" fill="#58a6ff" font-size="16" letter-spacing="3">ROBOTICS • AUTONOMOUS SYSTEMS • SOFTWARE ENGINEERING</text>
    <text x="600" y="224" fill="#3fb950" font-size="12" letter-spacing="4">BUILD // TEST // ITERATE</text>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11" fill="#8b949e" letter-spacing="1.5">
    <text x="42" y="42">SYS.1884</text>
    <text x="42" y="265">CONTROL / VISION / SIMULATION</text>
    <text x="1158" y="42" text-anchor="end">STATUS: BUILDING</text>
    <text x="1158" y="265" text-anchor="end">HARDWARE ↔ SOFTWARE</text>
  </g>

  <rect x="-360" y="0" width="360" height="300" fill="url(#scan)" opacity="0.9">
    <animate attributeName="x" values="-360;1200" dur="5.5s" repeatCount="indefinite" />
  </rect>

  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#30363d" stroke-width="2" />
</svg>
